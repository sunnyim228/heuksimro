<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>흑심으路</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-170%20-10%20640%20660%22%20fill%3D%22none%22%20stroke%3D%22%232a2a2e%22%20stroke-width%3D%2222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%22-170%22%20y%3D%22-10%22%20width%3D%22640%22%20height%3D%22660%22%20rx%3D%22140%22%20fill%3D%22%23f4efe4%22%20stroke%3D%22none%22/%3E%3Cpath%20d%3D%22M183%2014%20L156%2086%20L206%2083%20Z%22%20fill%3D%22%232a2a2e%22/%3E%3Cpath%20d%3D%22M162%2086%20L53%20395%20M200%2083%20L273%20378%20M53%20395%20L258%20610%20M273%20378%20L20%20600%20M20%20600%20Q140%20603%20258%20610%20M180%2086%20L163%20252%20C151%20258%20129%20270%20127%20287%20C126%20302%20141%20307%20151%20299%20C161%20291%20164%20272%20163%20252%22/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic+Coding&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: an afternoon desk by the window. Library = the notebook you used last (hero on the desk) + shelves by month.
   Notebook = slim top bar, desk stage with window light, a top-bound pad that flips upward, floating tool pill. */
:root{
  --bg:#ecebe7; --desk:#e9e8e4; --desk-2:#dddcd7; --f-type:"Nanum Gothic Coding", ui-monospace, monospace; --fg:#1f1d1a; --muted:#6f6a62; --faint:#a59f95; --line:rgba(31,29,26,.12);
  --surface:rgba(255,253,249,.84); --solid:#fffdf9; --sel:#1f1d1a; --sel-fg:#fffdf9; --danger:#b8402f;
  --sun:rgba(255,214,150,.55); --tone:rgba(31,29,26,.16);
  --shadow:0 18px 44px -18px rgba(60,45,25,.38),0 0 0 1px rgba(31,29,26,.06);
  --f-hand:system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --f-ui:"IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#app{height:100%;position:relative}
.screen{height:100%}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.grain::after{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.28;mix-blend-mode:multiply;pointer-events:none;z-index:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;min-height:38px;color:var(--fg)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--sel);color:var(--sel-fg)}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.outline{box-shadow:inset 0 0 0 1px var(--line)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--fg)}
.icon-btn.shelf-btn{display:inline-flex;gap:6px;width:auto;padding:0 12px 0 8px;margin-right:6px;font-size:14px;font-weight:600;background:var(--line)}
.icon-btn:disabled{opacity:.28}
.icon-btn:not(:disabled):active{background:var(--line)}

/* ---------- library ---------- */
[hidden]{display:none!important}
#library{display:grid;grid-template-rows:auto 1fr;position:relative;overflow:hidden}
.lib-top,.lib-body{position:relative;z-index:1}
.lib-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:18px 4px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:grid;gap:0;min-width:0}
.brand h1{margin:0;font-family:var(--f-hand);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.brand-row{display:flex;align-items:center;gap:10px}
.brand .logo{width:22px;height:46px;flex:none;color:var(--fg)}
.brand h1 .ro{font-weight:500;color:#6a6a70;margin-left:1px}
.brand .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib-actions{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.lib-body{overflow:auto;-webkit-overflow-scrolling:touch;display:grid;gap:34px;align-content:start;
  padding-block:16px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:520px){.lib-top,.lib-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

.hero{background:linear-gradient(170deg,#f1f0ec,#e3e2dd)!important;display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:30px;align-items:center;padding:30px 28px;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--desk),var(--desk-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.hero>*{position:relative;z-index:1}
.hero .lie{width:100%;max-width:150px;margin:6px auto;transform:rotate(-5deg);filter:drop-shadow(14px 18px 14px rgba(60,40,20,.28));cursor:pointer}
.hero h2{margin:0 0 6px;font-family:var(--f-hand);font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.02em;word-break:keep-all}
.hero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.7}
.hero .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.hero .eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600;margin-bottom:8px}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:start}.hero .lie{width:150px}}
.hero.empty{grid-template-columns:1fr}

/* covers */
.cover{position:relative;aspect-ratio:var(--ar,1/1.4);border-radius:3px 3px 6px 6px;background-color:var(--c);container-type:inline-size;isolation:isolate;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 -1px #f4f1ea,0 4px 0 -1px #d7d1c5,0 1px 2px rgba(0,0,0,.2),0 14px 24px -12px rgba(0,0,0,.4)}
.cover::before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:var(--grain);opacity:.6;mix-blend-mode:overlay;pointer-events:none}
.cover .coil{position:absolute;left:5%;right:5%;top:-3.2cqw;height:7cqw;min-height:6px;
  background:repeating-linear-gradient(90deg,transparent 0 1.6cqw,#6d7178 1.6cqw 2.1cqw,#eef0f3 2.1cqw 2.9cqw,#8d9199 2.9cqw 3.5cqw,transparent 3.5cqw 4.6cqw);border-radius:2px}
.cover.pass{border-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(0,0,0,.18),0 2px 0 -1px #efe7d6,0 1px 2px rgba(0,0,0,.2),0 14px 24px -12px rgba(0,0,0,.4)}
.cover.pass .coil{display:none}
.cover.pass .band{right:auto;left:50%;width:2.2cqw;background:#13203d;box-shadow:1px 0 1px rgba(0,0,0,.3)}
.cover.pass .tag{top:auto;bottom:14%;left:58%;max-width:36%;transform:rotate(2deg)}
.cover.pass .tape{left:54%;top:auto;bottom:30%}
.cover.leather{border-radius:8px;background-color:var(--c);
  background-image:radial-gradient(130% 100% at 30% 12%,rgba(255,255,255,.10),transparent 60%),radial-gradient(160% 140% at 50% 50%,transparent 55%,rgba(0,0,0,.26));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(0,0,0,.22),0 2px 0 -1px #efe6d3,0 3px 0 -1px #d6caB2,0 18px 28px -12px rgba(30,15,5,.5)}
.cover.leather.gloss{background-image:linear-gradient(118deg,transparent 16%,rgba(255,255,255,.34) 23%,rgba(255,255,255,.06) 31%,transparent 39%),radial-gradient(120% 90% at 25% 8%,rgba(255,255,255,.26),transparent 50%),radial-gradient(160% 140% at 50% 50%,transparent 52%,rgba(0,0,0,.34));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(0,0,0,.25),0 2px 0 -1px #efe6d3,0 3px 0 -1px #d6caB2,0 18px 28px -12px rgba(30,15,5,.55)}
.cover.leather::before{display:none}
.stitch{display:none;position:absolute;inset:5cqw;border:1px dashed rgba(245,226,196,.5);border-radius:5px;pointer-events:none}
.cover.leather .band{right:auto;left:76%;width:2.4cqw;min-width:3px;background:linear-gradient(90deg,#121212,#3b3633 50%,#121212);box-shadow:1px 0 3px rgba(0,0,0,.45)}
.cover .mark{position:absolute;left:13%;top:11%;width:7cqw;min-width:7px;aspect-ratio:300/640;color:rgba(255,236,210,.42);filter:drop-shadow(0 -1px 0 rgba(0,0,0,.55))}
.cover .mark svg{display:block;width:100%;height:100%}
.emb{position:absolute;left:13%;bottom:12%;right:30%;display:grid;gap:2cqw;color:rgba(255,236,210,.42);text-shadow:0 -1px 0 rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06)}
.emb b{font-family:var(--f-hand);font-weight:600;font-size:max(11px,9cqw);line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.emb i{font-style:normal;font-size:max(8px,4.6cqw);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.cover .band{position:absolute;top:0;bottom:0;right:12%;width:3cqw;min-width:3px;background:rgba(0,0,0,.45)}
.cover .tag{position:absolute;left:12%;top:18%;max-width:62%;background:#fbf9f3;color:#2b2824;padding:3cqw 4.5cqw 2.6cqw;border-radius:1px;
  box-shadow:0 1px 2px rgba(0,0,0,.2);transform:rotate(-1.5deg);display:grid;gap:1cqw}
.cover .tag b{font-family:var(--f-hand);font-weight:400;font-size:max(13px,12cqw);line-height:1;word-break:keep-all;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover .tag i{font-style:normal;font-size:max(8px,5.2cqw);letter-spacing:.08em;color:#8b847a;font-variant-numeric:tabular-nums}
.cover .tape{position:absolute;left:8%;top:13%;width:24%;height:7%;background:var(--tape,#e9d38b);opacity:.78;transform:rotate(-32deg);
  -webkit-mask:linear-gradient(90deg,transparent,#000 4% 96%,transparent);mask:linear-gradient(90deg,transparent,#000 4% 96%,transparent)}

/* filter + month shelves */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;background:var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg)}
#shelves{display:block}
.unit{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding:12px;border-radius:6px;
  background:linear-gradient(180deg,#dcc6a3,#cfb48c);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 40px -24px rgba(60,40,20,.5)}
.cubby{position:relative;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;padding:44px 16px 0;border-radius:2px;
  background:linear-gradient(180deg,#8f7352 0,#a68a66 22%,#b39773 100%);box-shadow:inset 0 10px 14px -6px rgba(40,25,10,.55),inset 6px 0 10px -6px rgba(40,25,10,.35),inset -6px 0 10px -6px rgba(40,25,10,.35)}
.cubby::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(180deg,#e2cfae,#c9ad84);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.clab{position:absolute;top:10px;left:12px;font-family:var(--f-type);font-size:13px;background:#fbfbf8;color:#1f1d1a;padding:4px 9px;box-shadow:0 1px 2px rgba(0,0,0,.25);transform:rotate(-1deg)}
.clab small{color:#8a857c;margin-left:6px;font-size:11px}
.cpile{display:flex;flex-direction:column-reverse;align-items:flex-start;position:relative;z-index:1}
.cpiles{display:flex;align-items:flex-end;gap:10px;flex-wrap:nowrap}
.cubby.future .clab{opacity:.55;box-shadow:none;background:rgba(251,251,248,.6)}
.cubby.future .cempty{opacity:.55}
@media (max-width:620px){.cubby{grid-column:auto!important}.cpiles{flex-direction:column-reverse;gap:0}}
.pbook{border:0;background:none;padding:0;margin-bottom:-26px;display:block;transform:translateX(var(--dx)) rotate(var(--rot));transition:transform .25s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 4px 4px rgba(30,15,5,.35))}
.pbook canvas{display:block}
.pbook:hover,.pbook:focus-visible{transform:translateX(calc(var(--dx) + 14px)) rotate(var(--rot))}
.pbook.just{animation:laydown .9s cubic-bezier(.2,.8,.25,1.1)}
.cempty{font-family:var(--f-type);font-size:12.5px;color:#f3e8d6;opacity:.85;padding-bottom:26px}
.month{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:end}
@media (max-width:560px){.month{grid-template-columns:1fr;gap:6px}}
.month-label{font-family:var(--f-type);font-size:15px;line-height:1;padding-bottom:16px}
.month-label>span{display:inline-block;background:#fbfbf8;color:#1f1d1a;padding:6px 10px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.month-label small{display:block;font-family:var(--f-ui);font-size:11.5px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
.shelf-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px 40px;padding:18px 6px 2px;min-height:60px}
.pile{display:flex;flex-direction:column-reverse;align-items:flex-start;min-width:0;max-width:100%}
.flat{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;margin-top:-1px;color:var(--fg);text-align:left;max-width:100%;
  transform:translateX(var(--dx)) rotate(var(--rot));transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.flat:hover,.flat:focus-visible{transform:translateX(calc(var(--dx) + 14px)) rotate(var(--rot))}
.flat .blk{position:relative;flex:none;width:var(--len);height:var(--th);border-radius:2px 5px 5px 2px;background:var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 3px -2px rgba(40,30,20,.45)}
.flat.pass .blk{background-image:radial-gradient(150% 200% at 50% 50%,transparent 50%,rgba(0,0,0,.3)),var(--lgrain)}
.flat .blk::before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:var(--grain);opacity:.5;mix-blend-mode:overlay}
.flat .pg{position:absolute;left:3px;right:4px;top:2.5px;bottom:2.5px;border-radius:1px 3px 3px 1px;
  background:repeating-linear-gradient(180deg,#faf5ea 0 1px,#d4c9b4 1px 1.6px);box-shadow:inset -3px 0 3px -2px rgba(0,0,0,.18)}
.flat.pass .blk::after{content:"";position:absolute;top:-1px;bottom:-1px;right:16%;width:3px;background:#13203d;border-radius:1px}
.flat .rib{position:absolute;left:4px;bottom:-26px;width:4px;height:30px;background:linear-gradient(90deg,#24170f,#4a3326,#24170f);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);transform:rotate(9deg);transform-origin:top}
.flat .sc{position:absolute;left:4px;height:var(--h);top:var(--t);right:var(--r);background:var(--sc);box-shadow:0 0 1px rgba(0,0,0,.2)}
.flat .done{position:absolute;left:14px;bottom:-24px;width:4px;height:26px;background:#b8402f;clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);transform:rotate(4deg);transform-origin:top}
.flat .lab{font-family:var(--f-type);font-size:13px;line-height:1.2;background:#fbfbf8;color:#1f1d1a;padding:4px 8px;box-shadow:0 1px 2px rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.flat .lab small{font-family:var(--f-type);font-size:11px;color:#8a857c;margin-left:7px;font-variant-numeric:tabular-nums}
.flat.just{animation:laydown .9s cubic-bezier(.2,.8,.25,1.1)}
@keyframes laydown{0%{transform:translate(60px,-60px) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:translateX(var(--dx)) rotate(var(--rot))}}
.shelf-row::-webkit-scrollbar{display:none}
.ledge{height:12px;position:relative}
.ledge::before{content:"";position:absolute;left:0;right:0;top:0;height:2.5px;background:var(--fg);border-radius:2px;filter:url(#rough)}
.ledge::after{content:"";position:absolute;left:4px;right:0;top:4px;height:9px;filter:url(#rough);background:repeating-linear-gradient(-55deg,var(--tone) 0 1px,transparent 1px 5px)}
.spine{position:relative;width:var(--w);height:var(--h);background:var(--c);border:0;border-radius:2px 2px 0 0;padding:0;flex:none;color:rgba(255,255,255,.92);
  box-shadow:inset 3px 0 4px -2px rgba(255,255,255,.22),inset -4px 0 5px -2px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.spine::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.55;mix-blend-mode:overlay;pointer-events:none}
.spine::after{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(180deg,#e9ebef 0 3px,#7e828a 3px 4px,transparent 4px 7px);opacity:.85}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine.pass{border-radius:4px 4px 1px 1px}
.spine.pass::after{left:auto;right:0;top:0;bottom:0;width:100%;opacity:1;background:linear-gradient(90deg,transparent 46%,#13203d 46% 54%,transparent 54%);height:auto}
.spine.pass .t{inset:12px 0 34px 0}
.spine .t{position:absolute;inset:12px 0 34px 3px;writing-mode:vertical-rl;font-family:var(--f-hand);font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:flex-start;overflow:hidden;white-space:nowrap}
.spine .d{position:absolute;left:3px;right:0;bottom:8px;font-size:10px;text-align:center;font-variant-numeric:tabular-nums;opacity:.85;letter-spacing:-.02em}
.spine.light{color:rgba(30,28,24,.8)}
.spine .done{position:absolute;right:5px;top:-1px;width:7px;height:16px;background:#c4473a;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.spine.just{animation:shelve .9s cubic-bezier(.2,.8,.25,1.15)}
@keyframes shelve{0%{transform:translateY(-110px) rotate(-10deg);opacity:0}55%{opacity:1}100%{transform:none}}
.empty-shelf{color:var(--faint);font-size:13px;padding:6px 0 14px}
.loading{color:var(--muted);font-size:13px;padding:8px 2px}
.err{background:var(--solid);border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}

/* ---------- notebook ---------- */
#notebook{display:grid;position:relative;grid-template-columns:1fr;grid-template-rows:52px 1fr;grid-template-areas:"top" "stage";background:var(--desk)}
.nb-top{grid-area:top;display:flex;align-items:center;gap:2px;background:var(--bg);z-index:8;min-width:0;box-shadow:0 1px 0 var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nb-title{min-width:0;flex:1;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.nb-title button{border:0;background:none;padding:2px;font-family:var(--f-hand);font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb-title .save{font-size:11px;color:var(--faint);white-space:nowrap}
@media (max-width:560px){.nb-title .save{display:none}}
.pager{display:inline-flex;align-items:center;border-radius:999px;background:var(--line);padding:2px;flex:none;margin:0 2px}
.pager .icon-btn{width:34px;height:32px;border-radius:999px}
.pager span{font-size:12.5px;min-width:66px;text-align:center;font-variant-numeric:tabular-nums}

.rail{position:absolute;z-index:7;display:flex;gap:2px;align-items:center;background:var(--surface);

.papers{display:flex;flex-wrap:wrap;gap:6px}
.paper-opt{border:0;background:transparent;border-radius:12px;padding:6px;display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--muted)}
.paper-opt canvas{border-radius:2px;box-shadow:0 0 0 1px var(--line),0 4px 8px -4px rgba(0,0,0,.25)}
.paper-opt[aria-pressed="true"]{background:var(--line);color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--danger)}
.catlist{display:grid;gap:8px}
.catrow{display:flex;gap:8px;align-items:center}
.catrow input{flex:1;min-width:0}
.catrow small{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu{position:fixed;z-index:45;background:var(--solid);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:230px}
.menu button,.setrow{border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.menu button:hover,.setrow:hover{background:var(--line)}
.menu .danger{color:var(--danger)}
.setrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--sel)}
.toggle.on::after{left:19px;background:var(--sel-fg)}
.share-img{display:block;max-width:100%;max-height:52vh;margin:0 auto;border-radius:4px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.share-note{font-size:12.5px;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.6}

.pal{position:fixed;z-index:45;width:min(340px,calc(100vw - 32px));background:var(--solid);border-radius:20px;padding:16px;box-shadow:var(--shadow);color:var(--fg)}
.pal h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.pans{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.pan{aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--sc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pan[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 0 0 2px var(--solid),0 0 0 3.5px var(--fg)}
.pal-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.pal-row label{display:flex;gap:8px;align-items:center;font-size:13px;margin-left:auto}
.pal-row input[type=color]{width:34px;height:26px;border:0;padding:0;background:none}
.pal .cur{width:28px;height:28px;border-radius:50%;background:var(--sc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pal .hex{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;background:var(--sel);color:var(--sel-fg);
  padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:50;transform-style:preserve-3d;pointer-events:none}
.fly .cover{position:absolute;inset:0;aspect-ratio:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fly .inside{position:absolute;inset:0;transform:rotateX(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;background:#c9ab7e}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(()=>{
'use strict';
const PAGES=30;let PW=1000,PH=1400;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtDate=t=>{const d=new Date(t);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
const shortDate=t=>{const d=new Date(t);return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`};

/* grain tiles */
(()=>{const g=document.createElement('canvas');g.width=g.height=128;const x=g.getContext('2d'),d=x.createImageData(128,128);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=70}x.putImageData(d,0,0);
  try{document.documentElement.style.setProperty('--grain',`url(${g.toDataURL()})`)}catch(e){}})();
const LTILE=(()=>{const g=document.createElement('canvas');g.width=g.height=180;const x=g.getContext('2d');
  for(let i=0;i<4200;i++){const px=Math.random()*180,py=Math.random()*180,r=.5+Math.random()*1.6;x.fillStyle=Math.random()<.55?'rgba(0,0,0,.075)':'rgba(255,240,220,.05)';x.beginPath();x.ellipse(px,py,r,r*(.55+Math.random()*.6),Math.random()*3,0,7);x.fill()}
  x.lineWidth=.8;x.strokeStyle='rgba(0,0,0,.07)';for(let i=0;i<46;i++){const px=Math.random()*180,py=Math.random()*180;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+Math.random()*30-15,py+Math.random()*30-15,px+Math.random()*44-22,py+Math.random()*44-22);x.stroke()}
  try{document.documentElement.style.setProperty('--lgrain',`url(${g.toDataURL()})`)}catch(e){}return g})();
const toothTile=(()=>{const g=document.createElement('canvas');g.width=g.height=96;const x=g.getContext('2d'),d=x.createImageData(96,96);
  for(let i=0;i<d.data.length;i+=4){const r=Math.random();d.data[i]=d.data[i+1]=d.data[i+2]=r<.5?60:255;d.data[i+3]=r<.5?Math.random()*18:Math.random()*22}x.putImageData(d,0,0);return g})();

function mkTile(n,fn){const c=document.createElement('canvas');c.width=c.height=n;fn(c.getContext('2d'),n);return c}
const wrapAt=(n,x,y,r,f)=>{for(const dx of [-n,0,n])for(const dy of [-n,0,n]){const a=x+dx,b=y+dy;if(a<-r||a>n+r||b<-r||b>n+r)continue;f(a,b)}};
const noiseTile=(n,v,amax,frac)=>mkTile(n,(x,S)=>{const d=x.createImageData(S,S);for(let i=0;i<d.data.length;i+=4){if(Math.random()<frac){d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*amax}}x.putImageData(d,0,0)});
const TEX={
  md:{name:'MD 미색',note:'매끈한 미색 노트지',bg:'#f5efe0',tint:'cream',tile:noiseTile(96,80,12,.6)},
  draw:{name:'도화지',note:'고운 결이 있는 흰 종이',bg:'#fbfaf5',tint:'white',tile:toothTile},
  water:{name:'수채화지',note:'오돌토돌한 코튼 결',bg:'#fbf8f0',tint:'white',tile:mkTile(192,(x,S)=>{const d=x.createImageData(S,S);
    const oct=(g)=>{const v=[];for(let i=0;i<g*g;i++)v.push(Math.random());const at=(i,j)=>v[((j%g+g)%g)*g+((i%g+g)%g)];return(X,Y)=>{const fx=X/S*g,fy=Y/S*g,i=Math.floor(fx),j=Math.floor(fy),tx=fx-i,ty=fy-j,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
      return(at(i,j)*(1-sx)+at(i+1,j)*sx)*(1-sy)+(at(i,j+1)*(1-sx)+at(i+1,j+1)*sx)*sy}};
    const a=oct(12),b=oct(32),c=oct(64);
    for(let Y=0;Y<S;Y++)for(let X=0;X<S;X++){const v=a(X,Y)*.45+b(X,Y)*.35+c(X,Y)*.2,o=(Y*S+X)*4,dk=v<.5;d.data[o]=d.data[o+1]=d.data[o+2]=dk?95:255;d.data[o+3]=Math.abs(v-.5)*(dk?70:90)}
    x.putImageData(d,0,0)})},
  hanji:{name:'한지',note:'섬유가 비치는 닥종이',bg:'#f3ede0',tint:'cream',tile:mkTile(256,(x,S)=>{for(let i=0;i<40;i++){const px=Math.random()*S,py=Math.random()*S,r=8+Math.random()*26;wrapAt(S,px,py,r,(u,v)=>{const g=x.createRadialGradient(u,v,0,u,v,r);g.addColorStop(0,'rgba(205,188,150,.10)');g.addColorStop(1,'rgba(205,188,150,0)');x.fillStyle=g;x.fillRect(u-r,v-r,r*2,r*2)})}
    for(let i=0;i<240;i++){const px=Math.random()*S,py=Math.random()*S,a=Math.random()*7,l=15+Math.random()*70;x.lineWidth=.4+Math.random()*1.3;x.strokeStyle=Math.random()<.6?`rgba(165,145,110,${.12+Math.random()*.2})`:'rgba(255,255,255,.6)';
      wrapAt(S,px,py,l,(u,v)=>{x.beginPath();x.moveTo(u,v);x.quadraticCurveTo(u+Math.cos(a+.6)*l*.5,v+Math.sin(a+.6)*l*.5,u+Math.cos(a)*l,v+Math.sin(a)*l);x.stroke()})}})},
  kraft:{name:'크라프트',note:'갈색 섬유 종이',bg:'#d6bf95',tint:'kraft',tile:mkTile(160,(x,S)=>{for(let i=0;i<520;i++){x.fillStyle=Math.random()<.7?`rgba(90,60,25,${.15+Math.random()*.3})`:'rgba(255,245,220,.35)';x.fillRect(Math.random()*S,Math.random()*S,.6+Math.random()*1.6,.6+Math.random()*1.2)}
    for(let i=0;i<80;i++){const px=Math.random()*S,py=Math.random()*S,a=Math.random()*7,l=6+Math.random()*16;x.strokeStyle='rgba(110,75,35,.22)';x.lineWidth=.6;wrapAt(S,px,py,l,(u,v)=>{x.beginPath();x.moveTo(u,v);x.lineTo(u+Math.cos(a)*l,v+Math.sin(a)*l);x.stroke()})}})},
  recycled:{name:'재생지',note:'작은 티끌이 섞인 종이',bg:'#ebe5d8',tint:'cream',tile:mkTile(160,(x,S)=>{const d=x.createImageData(S,S);for(let i=0;i<d.data.length;i+=4){if(Math.random()<.5){d.data[i]=d.data[i+1]=d.data[i+2]=110;d.data[i+3]=Math.random()*14}}x.putImageData(d,0,0);
    for(let i=0;i<260;i++){x.fillStyle=['rgba(60,60,60,.35)','rgba(80,110,160,.35)','rgba(170,80,70,.3)','rgba(120,100,70,.3)'][i%4];x.fillRect(Math.random()*S,Math.random()*S,.5+Math.random()*1.4,.5+Math.random()*1.4)}})},
  trace:{name:'트레싱지',note:'앞 장이 은은하게 비쳐요',bg:'#f2f2ef',tint:'white',tile:noiseTile(64,120,7,1),trace:true}
};
Object.entries({md:.8,draw:1,water:1.15,hanji:.95,kraft:1.05,recycled:1.1,trace:.7}).forEach(([k,v])=>{if(TEX[k])TEX[k].tooth=v});
const texOf=b=>TEX[b&&b.tex]||({white:TEX.draw,kraft:TEX.kraft})[b&&b.tint]||TEX.md;
const COVERS=[['#6b4226','브라운'],['#a8743f','카멜'],['#1f2f4f','네이비'],['#2a2522','블랙'],['#5e2b2a','버건디'],['#4a5638','올리브']];
const TAPES=['#e9d38b','#a9cbd8','#e6b3a8','#bcd3a4','#d8c4e3'];
const PAPERS=[['sketch','무지'],['lined','줄'],['grid','모눈'],['dot','점']];
const TINTS={
  white:{name:'흰 도화지',bg:'#fbfaf6',line:'rgba(70,95,140,.22)',strong:'rgba(60,70,90,.55)',margin:'rgba(205,80,80,.38)',blue:'rgba(70,150,215,.55)',ink:'rgba(60,60,60,.45)',dot:'rgba(70,95,140,.4)'},
  cream:{name:'미색',bg:'#f5efe0',line:'rgba(120,95,60,.24)',strong:'rgba(70,58,40,.55)',margin:'rgba(200,90,70,.38)',blue:'rgba(70,150,215,.5)',ink:'rgba(90,70,45,.5)',dot:'rgba(120,95,60,.42)'},
  kraft:{name:'크라프트',bg:'#d8c29a',line:'rgba(90,60,25,.26)',strong:'rgba(60,40,15,.55)',margin:'rgba(150,50,40,.4)',blue:'rgba(40,90,150,.45)',ink:'rgba(80,55,25,.6)',dot:'rgba(90,60,25,.45)'},
};

// a pencil drawn upright in a 24x64 box: lead and cone at the top, ferrule and eraser at the bottom
function pencilSVG(p,cls='real'){const len=p.len??1,sh=p.sharp??1,L=.42+.58*len,top=64-63*L,bot=63;

  const name=esc(p.name||'').slice(0,10),mid=(cb+be)/2;
  return`<svg class="${cls}" viewBox="0 0 24 64" aria-hidden="true">
<polygon points="4.5,${cb} 19.5,${cb} ${12+bw/2},${ty} ${12-bw/2},${ty}" fill="${WOOD}"/>
<polygon points="${12-lw/2},${ly} ${12+lw/2},${ly} ${12+bw/2},${ty} ${12-bw/2},${ty}" fill="${lead}"/>
<rect x="4.5" y="${cb}" width="15" height="${be-cb}" fill="${p.body}"/>
<path d="M4.5 ${cb} Q7 ${cb-1.6} 9 ${cb} Q10.5 ${cb-1.6} 12 ${cb} Q13.5 ${cb-1.6} 15 ${cb} Q17 ${cb-1.6} 19.5 ${cb}z" fill="${p.body}"/>
<rect x="4.5" y="${cb}" width="4.2" height="${be-cb}" fill="rgba(255,255,255,.2)"/><rect x="15.2" y="${cb}" width="4.3" height="${be-cb}" fill="rgba(0,0,0,.2)"/>

  :`<rect x="4.5" y="${bot-1.6}" width="15" height="1.6" fill="rgba(0,0,0,.22)"/>`}

const SHARP_SVG=`<svg class="real" viewBox="0 0 24 64" aria-hidden="true"><rect x="3.5" y="20" width="17" height="26" rx="3.5" fill="#d8322b"/><rect x="3.5" y="20" width="17" height="6" rx="3" fill="rgba(255,255,255,.2)"/><circle cx="12" cy="29" r="4.6" fill="#4a1410"/><circle cx="12" cy="29" r="2" fill="#1a0505"/><rect x="5.5" y="36.5" width="13" height="6.5" rx="1" fill="#c9ccd1"/><circle cx="12" cy="39.7" r="1.2" fill="#8a8e94"/></svg>`;

/* ---------- 연필깎이: circle around the sharpener, shavings fall ---------- */
function openSharpener(){closePop();commitText();const p=curP();
  const bd=sheet(`<h3>연필 깎기 <small style="font-size:14px;color:var(--muted);font-weight:500">${esc(p.name)}</small></h3><p class="sub" id="shMsg">연필깎이 둘레를 손가락이나 펜슬로 빙글빙글 돌려 보세요. 꾹 누르고 있어도 조금씩 깎여요.</p>
    <div class="sharp-stage" id="shStage"><canvas id="shFx"></canvas><div class="sh-pencil" id="shPen"></div>
      <svg class="sh-box" viewBox="0 0 120 100" aria-hidden="true"><rect x="8" y="14" width="104" height="72" rx="12" fill="#d8322b"/><rect x="8" y="14" width="104" height="18" rx="10" fill="rgba(255,255,255,.18)"/>
      <ellipse cx="14" cy="50" rx="7" ry="14" fill="#4a1410"/><ellipse cx="14" cy="50" rx="3.5" ry="8" fill="#1a0505"/><rect x="38" y="30" width="58" height="40" rx="3" fill="#c9ccd1"/><rect x="38" y="30" width="58" height="6" fill="#e2e4e8"/><circle cx="67" cy="50" r="5" fill="#8a8e94"/><path d="M64 50h6M67 47v6" stroke="#5d6166" stroke-width="1.4"/></svg></div>
    <div class="sh-meter"><span>뾰족함</span><i><b id="shBar"></b></i><span>길이</span><i><b id="shLen"></b></i></div>
    <footer><button class="btn ghost" type="button" id="shNew">새 연필로 바꾸기</button><span class="grow"></span><button class="btn primary" type="button" id="shDone">다 깎았어요</button></footer>`);
  const q=s=>bd.querySelector(s),st=q('#shStage'),fx=q('#shFx'),pen=q('#shPen'),dpr=Math.min(2,devicePixelRatio||1);let parts=[],down=false,lastA=null,acc=0,snd=0,raf=0,done=false;
  const box=()=>st.getBoundingClientRect();
  const holeX=()=>q('.sh-box').getBoundingClientRect().left+q('.sh-box').getBoundingClientRect().width*.12-box().left,holeY=()=>box().height/2;
  const show=()=>{const L=.42+.58*(p.len??1),H=160;pen.innerHTML=pencilSVG(p,'big');pen.style.transform=`translate(${(holeX()-98+H*(1-L)*.98).toFixed(1)}px,${(holeY()-80).toFixed(1)}px) rotate(90deg) translateX(${(Math.sin(acc/9)*1).toFixed(2)}px)`;
    q('#shBar').style.width=Math.round((p.sharp??1)*100)+'%';q('#shLen').style.width=Math.round((p.len??1)*100)+'%'};
  const resize=()=>{const r=box();fx.width=r.width*dpr;fx.height=r.height*dpr};resize();show();
  const grind=()=>{const a=audio();if(!a)return;const t=a.currentTime;const s=a.createBufferSource();s.buffer=noise;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400+Math.random()*1400;bp.Q.value=1.6;
    const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(bp).connect(g).connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+.1)};
  const shave=()=>{const r=box();parts.push({x:holeX()-4+Math.random()*8,y:holeY()+8,vx:-.4+Math.random()*1.2,vy:.5+Math.random(),a:Math.random()*6,va:(Math.random()-.5)*.2,s:5+Math.random()*7,rest:false});if(parts.length>220)parts.shift()};
  const turn=deg=>{if(done)return;if((p.len??1)<=.18){q('#shMsg').textContent='몽당연필이 됐어요. 새 연필로 바꿔 쓰거나 공방에서 하나 더 만들어 보세요.';return}
    const before=p.sharp??1;p.sharp=Math.min(1,before+deg/360*.22);p.len=Math.max(.18,(p.len??1)-deg/360*.012);acc+=deg;snd+=deg;

/* ---------- lights out: glow-in-the-dark strokes ---------- */
function strokePath(P,k){const n=P.length/3,path=new Path2D();if(!n)return path;path.moveTo(P[0]*k,P[1]*k);
  for(let i=1;i<n-1;i++)path.quadraticCurveTo(P[i*3]*k,P[i*3+1]*k,(P[i*3]+P[i*3+3])/2*k,(P[i*3+1]+P[i*3+4])/2*k);
  if(n>1)path.lineTo(P[n*3-3]*k,P[n*3-2]*k);else path.lineTo(P[0]*k+.1,P[1]*k);return path}
function glowStroke(x,it,k){const path=strokePath(it.pts,k);x.save();x.lineCap=x.lineJoin='round';
  x.strokeStyle=it.c;x.shadowColor=it.c;x.shadowBlur=16*k;x.globalAlpha=.5;x.lineWidth=it.w*k*2.4;x.stroke(path);
  x.shadowBlur=6*k;x.globalAlpha=1;x.lineWidth=it.w*k*.95;x.strokeStyle=mixC(it.c,'#ffffff',.5);x.stroke(path);x.restore()}
function renderGlow(sl){const c=sl.glow;if(!c)return;const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);
  if(!S.dark||!sl.n||!S.pages[sl.n])return;const k=c.width/PW;
  for(const it of S.pages[sl.n].items){if(it.k!=='s')continue;
    if(it.t==='eraser'){x.save();x.globalCompositeOperation='destination-out';x.lineCap=x.lineJoin='round';x.lineWidth=it.w*k;x.stroke(strokePath(it.pts,k));x.restore()}
    else if(it.g==='G')glowStroke(x,it,k)}}
function setNight(on){S.dark=on;NB.classList.toggle('dark',on);$('#btnNight').setAttribute('aria-pressed',on);SLOTS.forEach(renderGlow)}

function renderTools(){

  document.querySelectorAll('.tool[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===prefs.tool&&(!b.dataset.ink||b.dataset.ink===prefs.ink)&&(!b.dataset.pid||b.dataset.pid===prefs.pid)));
  document.querySelectorAll('.tool[data-group]').forEach(b=>{const set=b.dataset.group==='pen'?PEN_SET:BRUSH_SET,on=set.includes(prefs.tool),cur=on?prefs.tool:(b.dataset.group==='pen'?prefs.lastPen:prefs.lastBrush);
    b.innerHTML=ICON[cur]+'<i class="more"></i>';b.setAttribute('aria-pressed',on);b.title=TOOL_INFO[cur][0]});

/* ---------- backup ---------- */
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function exportBackup(){if(S.book)flush();hint('백업 파일을 만드는 중…');
  try{const out={app:'sonsucheop',v:1,exported:Date.now(),books:[]};
    for(const b of S.books){const pages=await Store.loadPages(b.id);
      for(const pg of Object.values(pages))for(const ph of (pg.photos||[]))if(ph.aid&&!ph.src){try{ph.src=await blobToData(await (await fetch('/_blob/'+ph.aid)).blob());delete ph.aid}catch(e){}}
      out.books.push({book:{...b},pages})}
    const name=`흑심으로-백업-${fmtDate(Date.now()).replace(/\./g,'')}.json`,blob=new Blob([JSON.stringify(out)],{type:'application/json'});
    if(Store.downloads){try{await Store.downloads.save({filename:name,data:blob});toast('백업 파일을 저장했어요')}catch(e){if(!e||e.code!=='declined')toast('백업 파일을 저장하지 못했어요')}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('백업 파일을 저장했어요')}}
  catch(e){toast('백업 파일을 만들지 못했어요')}}
async function importBackup(data){hint('백업을 불러오는 중…');let skipped=0;
  try{for(const {book,pages} of data.books){if(!book||!book.id)continue;const b={...book,fmt:'pass'};
      for(const [n,pg] of Object.entries(pages||{})){const body={n:+n,items:Array.isArray(pg.items)?pg.items:[],photos:[],up:Date.now()};
        for(const ph of (pg.photos||[])){const p={...ph};
          if(p.src&&Store.mode==='cloud'&&Store.assets){try{const a=await Store.assets.upload(await (await fetch(p.src)).blob());p.aid=a.id;delete p.src}catch(e){}}
          body.photos.push(p)}
        while(JSON.stringify(body).length>250000&&body.photos.some(p=>p.src)){const i=body.photos.findIndex(p=>p.src);body.photos.splice(i,1);skipped++}
        await Store.setPage(b.id,+n,body)}
      await Store.setBook(b);const i=S.books.findIndex(x=>x.id===b.id);if(i>=0)S.books[i]=b;else S.books.push(b)}
    renderLibrary();toast(skipped?`불러왔어요. 너무 큰 사진 ${skipped}장은 넣지 못했어요`:'백업을 불러왔어요')}
  catch(e){toast('백업을 불러오지 못했어요');renderLibrary()}}

/* ---------- share ---------- */
function pageCanvas(n,cw,ch){const [W]=dims(S.book),c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d');drawPaper(ctx,S.book,n,cw,ch);
  const ph=document.createElement('canvas');ph.width=cw;ph.height=ch;drawPhotos(ph.getContext('2d'),n,cw/W);ctx.drawImage(ph,0,0);
  const ink=document.createElement('canvas');ink.width=cw;ink.height=ch;renderInk(ink.getContext('2d'),n,cw/W);ctx.drawImage(ink,0,0);return c}
function exportCanvas(){const [W,H]=dims(S.book),ns=S.spread?[SA.n,SB.n].filter(Boolean):[S.cur],sc=Math.min(2,2200/Math.max(W*ns.length,H)),
  pw=Math.round(W*sc),ph=Math.round(H*sc),rim=side()?Math.round(22*sc):0,c=document.createElement('canvas');
  c.width=pw*ns.length+rim*2;c.height=ph+rim*2;const ctx=c.getContext('2d');
  if(rim){ctx.fillStyle=S.book.color;ctx.beginPath();ctx.roundRect?ctx.roundRect(0,0,c.width,c.height,rim*.9):ctx.rect(0,0,c.width,c.height);ctx.fill()}
  ns.forEach((n,i)=>ctx.drawImage(pageCanvas(n,pw,ph),rim+i*pw,rim));
  if(ns.length===2){const gx=rim+pw,g=ctx.createLinearGradient(gx-pw*.08,0,gx+pw*.08,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,'rgba(0,0,0,.07)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(gx-pw*.08,rim,pw*.16,ph)}
  ctx.fillStyle=(TINTS[S.book.tint]||TINTS.white).ink;ctx.font=`${Math.round(20*sc)}px system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;ctx.textAlign='left';
  ctx.fillText(`${S.book.title} · ${fmtDate(Date.now())}`,rim+(side()?110:46)*sc,rim+(H-26)*sc);return c}
async function shareSheet(){commitText();desel();closePop();flush();hint('공유 이미지를 만드는 중…');await new Promise(r=>setTimeout(r,30));const n=S.cur,label=S.spread&&SB.n?`${n}–${SB.n}장`:`${n}장`;let c,url;
  try{c=exportCanvas();url=c.toDataURL('image/png')}catch(e){toast('붙인 사진을 아직 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.');return}
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const texts=[SA.n,S.spread?SB.n:0].filter(Boolean).flatMap(k=>S.pages[k].items.filter(i=>i.k==='t').map(i=>i.v)).join('\n\n');
  const bd=sheet(`<h3>${S.spread?'펼친 두 장':'이 장'} 공유하기</h3><img class="share-img" src="${url}" alt="${esc(S.book.title)} ${label}">
    <p class="share-note">iPad에서는 이미지를 길게 누르면 공유하기·사진에 저장 메뉴가 열려요.</p>
    <footer><span class="grow">${texts?'<button class="btn outline" type="button" id="shText">글만 복사</button>':''}</span><button class="btn outline" type="button" id="shCopy">이미지 복사</button>${Store.downloads?'<button class="btn primary" type="button" id="shSave">이미지로 저장</button>':''}<button class="btn ghost" type="button" id="shClose">닫기</button></footer>`);

  q('#shCopy').onclick=()=>{const fail=()=>toast('이 화면에서는 복사가 막혀 있어요. 이미지를 길게 눌러 공유해 주세요.');
    try{navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>toast('이미지를 복사했어요. 메시지나 메모에 붙여 넣어 보세요.'),fail)}catch(e){fail()}};
  if(q('#shText'))q('#shText').onclick=()=>{try{navigator.clipboard.writeText(texts).then(()=>toast('글을 복사했어요'),()=>toast('복사하지 못했어요'))}catch(e){toast('복사하지 못했어요')}};
  if(q('#shSave'))q('#shSave').onclick=async()=>{try{await Store.downloads.save({filename:`${S.book.title.replace(/[\\/:*?"<>|]/g,'')}-${label}.png`,data:blob});toast('이미지를 저장했어요')}catch(e){if(!e||e.code!=='declined')toast('저장하지 못했어요. 이미지를 길게 눌러 저장해 주세요.')}}}
$('#btnShare').onclick=shareSheet;

/* ---------- open / close ---------- */
function flyCover(b,fromRect,target,opening){
  if(reduced||!fromRect||!target)return Promise.resolve();
  const sd=b.fmt==='pass',fc=document.createElement('div');fc.className='fly';fc.innerHTML=coverHTML(b)+'<div class="inside"></div>';
  if(sd)fc.querySelector('.inside').style.transform='rotateY(180deg)';
  Object.assign(fc.style,{left:target.left+'px',top:target.top+'px',width:target.width+'px',height:target.height+'px'});document.body.append(fc);
  const sx=fromRect.width/target.width,sy=fromRect.height/target.height,dx=fromRect.left-target.left,dy=fromRect.top-target.top,far=`translate(${dx}px,${dy}px) scale(${sx},${sy})`;
  const R=d=>sd?`perspective(2200px) rotateY(${-d}deg)`:`perspective(2200px) rotateX(${d}deg)`,org=sd?'0 50%':'50% 0';
  if(opening){fc.style.transformOrigin='0 0';
    return fc.animate([{transform:far},{transform:'none'}],{duration:440,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}).finished
      .then(()=>{fc.style.transformOrigin=org;rustle(.5,.14);flap(.5);return fc.animate([{transform:R(0),opacity:1},{transform:R(165),opacity:0}],{duration:720,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'}).finished})
      .then(()=>fc.remove(),()=>fc.remove())}
  fc.style.transformOrigin=org;rustle(.4,.12);flap(.42);
  return fc.animate([{transform:R(165),opacity:0},{transform:R(0),opacity:1}],{duration:520,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished
    .then(()=>fc.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(30px) scale(.9)'}],{duration:240,fill:'forwards'}).finished).then(()=>fc.remove(),()=>fc.remove())}
const coverTarget=()=>(S.spread?SB:SA).el.getBoundingClientRect();
async function openBook(id,fromEl,fresh){const b=S.books.find(x=>x.id===id);if(!b)return;audio();
  b.fmt='pass';const fromRect=fromEl&&fromEl.getBoundingClientRect();let data={};
  if(!fresh){try{data=await Store.loadPages(id)}catch(e){toast('수첩을 펼치지 못했어요. 잠시 뒤 다시 시도해 주세요.');return}}
  S.book=b;S.pages={};S.hist=[];S.redo=[];S.comp={};inkCache.clear();
  for(let n=1;n<=PAGES;n++){const body=data[n];S.pages[n]={items:body&&Array.isArray(body.items)?body.items.map(deItem):[],photos:body&&Array.isArray(body.photos)?body.photos.map(p=>({...p})):[],bytes:null}}
  S.cur=clamp(b.last||1,1,PAGES);$('#nbTitle').textContent=b.title;setSave('');
  $('#library').hidden=true;NB.hidden=false;$('#hint').hidden=true;renderTools();layout();
  flyCover(b,fromRect&&fromRect.width?fromRect:null,coverTarget(),true)}
function shelveNow(){if(!S.book)return;commitText();desel();S.book.shelvedAt=Date.now();S.book.last=S.cur;if(dirty.size)flush();else saveBook(S.book)}
async function leave(){const b=S.book;if(!b)return;closePop();if(S.dark)setNight(false);shelveNow();if(flip){flip.leaf.remove();flip=null;bookEl.classList.remove('flipping')}
  const t=coverTarget();await flyCover(b,t,t,false);
  NB.hidden=true;$('#library').hidden=false;S.book=null;S.pages={};S.comp={};inkCache.clear();renderLibrary(b.id);toast(isDone(b)?'다 쓴 수첩을 책장에 눕혔어요. 이제 새 수첩을 펼 수 있어요':`${shortDate(b.shelvedAt)} 책장에 꽂았어요`)}
$('#vOne').onclick=()=>{prefs.pages='one';savePrefs();commitText();layout()};$('#vTwo').onclick=()=>{prefs.pages='two';savePrefs();commitText();layout()};
$('#btnBack').onclick=leave;$('#nbTitle').onclick=()=>bookSheet(S.book);
$('#btnUndo').onclick=()=>undoRedo(S.hist,S.redo);$('#btnRedo').onclick=()=>undoRedo(S.redo,S.hist);
$('#pgPrev').onclick=()=>flipTo(-1);$('#pgNext').onclick=()=>flipTo(1);
$('#ticks').addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(!t||flip)return;const n=+t.dataset.go;if(n===S.cur)return;
  const d=n>S.cur?1:-1;if(Math.abs(n-S.cur)<=step()){flipTo(d);return}audio();rustle(.45,.14);flap(.36);
  bookEl.animate([{opacity:1,transform:'none'},{opacity:.35,transform:`translateX(${-d*18}px)`},{opacity:1,transform:'none'}],{duration:reduced?0:360,easing:'ease-out'});setTimeout(()=>jumpTo(n),reduced?0:150)});
$('#btnMore').onclick=()=>{if(popEl&&popEl.classList.contains('menu')){closePop();return}
  const el=document.createElement('div');el.className='menu';
  el.innerHTML=`<button type="button" data-m="info"><span>수첩 정보 편집</span></button>
    <button type="button" data-m="pencil"><span>펜슬 전용 필기</span><span class="toggle ${prefs.pencilOnly?'on':''}"></span></button>
    <button type="button" data-m="sound"><span>종이 넘기는 소리</span><span class="toggle ${prefs.sound?'on':''}"></span></button>
    <button type="button" data-m="clear"><span>보이는 장 비우기</span></button>
    <button type="button" data-m="shelve"><span>책장에 꽂고 나가기</span><span style="color:var(--muted);font-size:12px">${S.book.used||0}/30장</span></button>`;
  el.addEventListener('click',e=>{const btn=e.target.closest('[data-m]'),m=btn&&btn.dataset.m;if(!m)return;
    if(m==='pencil'){prefs.pencilOnly=!prefs.pencilOnly;savePrefs();btn.querySelector('.toggle').classList.toggle('on',prefs.pencilOnly);return}
    if(m==='sound'){prefs.sound=!prefs.sound;savePrefs();btn.querySelector('.toggle').classList.toggle('on',prefs.sound);return}
    if(m==='clear'){el.innerHTML=`<div style="padding:10px 12px;font-size:13.5px">${S.spread&&SB.n?S.cur+'–'+SB.n:S.cur}장의 글·그림·사진을 모두 지울까요? 실행 취소로 되돌릴 수 있어요.</div><button type="button" data-m="clearYes" class="danger">비우기</button><button type="button" data-m="no">그만두기</button>`;return}
    closePop();
    if(m==='info')bookSheet(S.book);
    else if(m==='clearYes'){[SA.n,S.spread?SB.n:0].filter(Boolean).forEach(n=>{const pg=S.pages[n];if(!pg.items.length&&!pg.photos.length)return;pushHist(n,snap(n));pg.items=[];pg.photos=[];pg.bytes=null;markDirty(n)});renderVisible()}
    else if(m==='shelve')leave()});
  showPop(el,$('#btnMore'))};

/* ---------- global ---------- */
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!$('#library').hidden&&S.loaded)renderLibrary();commitText();if(flip){flip.leaf.remove();flip=null}layout();closePop()},140)});
addEventListener('keydown',e=>{if(NB.hidden||e.target.closest('input,textarea'))return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='PageDown')flipTo(1);else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp')flipTo(-1);
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?undoRedo(S.redo,S.hist):undoRedo(S.hist,S.redo)}});
// leaving the app shelves the open notebook with today's date
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.book)shelveNow()}});
addEventListener('pagehide',()=>{if(S.book)shelveNow()});
stage.addEventListener('touchmove',e=>{if(!e.target.closest('textarea'))e.preventDefault()},{passive:false});
stage.addEventListener('gesturestart',e=>e.preventDefault());

async function load(){renderLibrary();
  try{const prof=await Store.getProfile();if(prof&&Array.isArray(prof.cats)&&prof.cats.length){S.cats=prof.cats;S.profileSaved=true}
    S.books=(await Store.listBooks()).filter(b=>b&&b.id);S.loaded=true}catch(e){S.loadErr=e}
  if(prefs.filter!=='all'&&!S.cats.some(c=>c.id===prefs.filter))prefs.filter='all';renderLibrary()}
(async()=>{renderTools();await Store.init();if(Store.mode==='local')Store.persist();await load();
  try{await Promise.race([Promise.all([document.fonts.load('400 30px "Noto Sans KR"'),document.fonts.load('500 18px "IBM Plex Sans KR"')]),new Promise(r=>setTimeout(r,3000))])}catch(e){}
  renderLibrary();if(!NB.hidden){S.comp={};renderVisible()}})();
})();
</script>

<style>.upd{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;gap:10px;align-items:center;
  background:#1f1d1a;color:#f6f2ea;font:500 14px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;padding:10px 10px 10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.upd button{border:0;border-radius:999px;padding:8px 14px;background:#f6f2ea;color:#1f1d1a;font:inherit;font-weight:600}</style>
<script>
// offline + updates: a new version waits until you tap "지금 바꾸기" (your pages are saved first)
if('serviceWorker' in navigator){addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const ask=w=>{if(document.querySelector('.upd'))return;const t=document.createElement('div');t.className='upd';t.setAttribute('role','status');
      t.innerHTML='새 버전이 준비됐어요 <button type="button">지금 바꾸기</button>';
      t.querySelector('button').onclick=()=>{dispatchEvent(new Event('pagehide'));t.querySelector('button').textContent='저장하는 중…';setTimeout(()=>w.postMessage('skip'),1200)};document.body.append(t)};
    if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(done)return;done=true;location.reload()});
})}
</script>
